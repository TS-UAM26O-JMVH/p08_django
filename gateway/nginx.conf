#codigo 31.
events {}

http {

    # Resolver DNS interno de Docker — obliga a nginx a re-resolver los
    # nombres de los servicios cada 10s en vez de cachear la IP para
    # siempre (esto es lo que causaba que, al reconstruir un servicio sin
    # reiniciar el gateway, el tráfico se cruzara entre servicios).
    resolver 127.0.0.11 valid=10s;

    map $http_origin $cors_origin {
        default "";

        "http://localhost:3000" $http_origin;
        "http://127.0.0.1:3000" $http_origin;
        "http://localhost:4200" $http_origin;
    }

    server {

        listen 80;

        add_header Access-Control-Allow-Origin $cors_origin always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Origin, Accept, X-Requested-With" always;
        add_header Access-Control-Allow-Credentials "true" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        ############################
        # AUTH
        ############################

        location /api/auth/swagger/ {
            set $upstream_auth servicio_auth:8000;
            rewrite ^/api/auth/swagger/(.*)$ /swagger/$1 break;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host;
        }

        location /api/auth/redoc/ {
            set $upstream_auth servicio_auth:8000;
            rewrite ^/api/auth/redoc/(.*)$ /redoc/$1 break;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host;
        }

        location /api/auth/swagger.json {
            set $upstream_auth servicio_auth:8000;
            rewrite ^/api/auth/swagger.json$ /swagger.json break;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host;
        }

        location /api/auth/ {
            set $upstream_auth servicio_auth:8000;
            proxy_pass http://$upstream_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ############################
        # USUARIOS
        ############################

        location /api/usuarios/swagger/ {
            set $upstream_usuarios servicio_usuarios:8000;
            rewrite ^/api/usuarios/swagger/(.*)$ /swagger/$1 break;
            proxy_pass http://$upstream_usuarios;
            proxy_set_header Host $host;
        }

        location /api/usuarios/redoc/ {
            set $upstream_usuarios servicio_usuarios:8000;
            rewrite ^/api/usuarios/redoc/(.*)$ /redoc/$1 break;
            proxy_pass http://$upstream_usuarios;
            proxy_set_header Host $host;
        }

        location /api/usuarios/swagger.json {
            set $upstream_usuarios servicio_usuarios:8000;
            rewrite ^/api/usuarios/swagger.json$ /swagger.json break;
            proxy_pass http://$upstream_usuarios;
            proxy_set_header Host $host;
        }

        location /api/usuarios/ {
            set $upstream_usuarios servicio_usuarios:8000;
            proxy_pass http://$upstream_usuarios;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        ############################
        # PRODUCTOS
        ############################

        location /api/productos/swagger/ {
            set $upstream_productos servicio_productos:8000;
            rewrite ^/api/productos/swagger/(.*)$ /swagger/$1 break;
            proxy_pass http://$upstream_productos;
            proxy_set_header Host $host;
        }

        location /api/productos/redoc/ {
            set $upstream_productos servicio_productos:8000;
            rewrite ^/api/productos/redoc/(.*)$ /redoc/$1 break;
            proxy_pass http://$upstream_productos;
            proxy_set_header Host $host;
        }

        location /api/productos/swagger.json {
            set $upstream_productos servicio_productos:8000;
            rewrite ^/api/productos/swagger.json$ /swagger.json break;
            proxy_pass http://$upstream_productos;
            proxy_set_header Host $host;
        }

        location /api/productos/ {
            set $upstream_productos servicio_productos:8000;
            proxy_pass http://$upstream_productos;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

    }
}